name: Build Executables (Windows, Linux, macOS)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: turni-pulizie-linux
            exe_path: dist/pulizie
          - os: windows-latest
            asset_name: turni-pulizie-windows.exe
            exe_path: dist/pulizie.exe
          - os: macos-latest
            asset_name: turni-pulizie-macos
            exe_path: dist/pulizie

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconsole --onefile pulizie.py

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.exe_path }}
